name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace
        run: claude plugin validate . --strict

      - name: Validate plugin
        shell: bash
        run: claude plugin validate plugins/orcheatractor-zhaowendao --strict

      - name: Test plugin
        shell: bash
        run: claude plugin test plugins/orcheatractor-zhaowendao

      - name: Python compile
        shell: bash
        run: |
          python -m py_compile plugins/orcheatractor-zhaowendao/model-agents/bin/sync.py
          python -m py_compile plugins/orcheatractor-zhaowendao/model-agents/adapters/claude_settings.py

      - name: Cross-platform sync smoke
        shell: bash
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-ci
        run: |
          python -I plugins/orcheatractor-zhaowendao/model-agents/bin/sync.py sync
          python -I plugins/orcheatractor-zhaowendao/model-agents/bin/sync.py list
